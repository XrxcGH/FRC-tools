name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because this project's dependencies are two crypto libraries and its
  # real risk is bit-rot over a season when nobody is touching it.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  test:
    name: tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Every version runs even when one fails: knowing it is "22 only" is more
      # useful than knowing "something failed".
      fail-fast: false
      matrix:
        # 22.6 is the first release with type stripping behind a flag, and the
        # README claims support from there. This matrix is what makes that claim
        # checkable rather than asserted.
        node: ['22.x', '24.x', 'lts/*']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  vectors:
    name: conformance vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci

      # The test suite already checks the implementation against the committed
      # vectors. This checks the other direction: that the committed vectors are
      # actually what the generator produces, so nobody can hand-edit a vector
      # to make a failing test pass.
      - name: regenerate and require no diff
        run: |
          npm run vectors
          if ! git diff --quiet -- spec/vectors/; then
            echo "::error::Committed vectors differ from what the generator produces."
            echo "Either a wire-format change landed without regenerating, or a vector"
            echo "was hand-edited. Both are wire-format changes and need a version bump."
            git --no-pager diff --stat -- spec/vectors/
            exit 1
          fi
          echo "Vectors are reproducible."

  demo:
    name: the demo still runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci

      # The demo is the only thing exercising every package together, so it
      # catches integration breaks the per-package tests do not.
      - name: run the event-day walkthrough
        run: npm run demo

      - name: the CLI works end to end
        run: |
          set -e
          W="$RUNNER_TEMP/ci"
          node --experimental-strip-types packages/courier-cli/src/main.ts init 2027mose pit-laptop --dir "$W/laptop"
          node --experimental-strip-types packages/courier-cli/src/main.ts init 2027mose stands-tablet --dir "$W/tablet"
          node --experimental-strip-types packages/courier-cli/src/main.ts join-request "$W/req.bin" --dir "$W/tablet"
          # Grant ONCE and keep its output: a second grant re-stages with a fresh
          # code, and the confirm would then compare against the wrong one.
          # Read the digits off the "Confirmation code:" line specifically —
          # a bare six-digit grep also matches runs inside the hex key id.
          node --experimental-strip-types packages/courier-cli/src/main.ts grant "$W/req.bin" "$W/grant.bin" --dir "$W/laptop" | tee "$W/grant.out"
          CODE=$(grep 'Confirmation code:' "$W/grant.out" | tr -dc '0-9')
          case "$CODE" in [0-9][0-9][0-9][0-9][0-9][0-9]) ;; *) echo "::error::confirmation code was '$CODE', not six digits"; exit 1;; esac
          node --experimental-strip-types packages/courier-cli/src/main.ts accept "$W/grant.bin" "$W/req.bin" --dir "$W/tablet"

          # The ceremony is not finished until the codes are compared: `confirm`
          # is what admits the joiner. Skipping it leaves the laptop trusting
          # nobody, and every later step would pass while moving zero records.
          node --experimental-strip-types packages/courier-cli/src/main.ts confirm "$CODE" "$CODE" --dir "$W/laptop"
          printf 'ada\t1\t8793\t3\nbo\t1\t8793\t4\n' > "$W/scans.txt"
          node --experimental-strip-types packages/courier-cli/src/main.ts ingest "$W/scans.txt" --dir "$W/tablet"
          node --experimental-strip-types packages/courier-cli/src/main.ts export "$W/day.courier" --dir "$W/tablet"
          node --experimental-strip-types packages/courier-cli/src/main.ts import "$W/day.courier" --dir "$W/laptop"
          node --experimental-strip-types packages/courier-cli/src/main.ts verify --dir "$W/laptop"

          # Assert the records actually crossed. Every command above exits 0
          # even when nothing moves, so without this the whole walkthrough can
          # pass while transferring an empty store.
          node --experimental-strip-types packages/courier-cli/src/main.ts status --dir "$W/laptop" | grep -E 'records +2'
          echo "Two records reached the laptop." 

      # The analysis commands need real volume: three observations per team
      # before anyone is ranked, and two scouts on a robot before anyone can be
      # compared. A two-line fixture would exercise only the refusal paths.
      - name: the analysis commands work on a real store
        run: |
          set -e
          W="$RUNNER_TEMP/ci-analysis"
          C="node --experimental-strip-types packages/courier-cli/src/main.ts"
          $C init 2027mose pit-laptop --dir "$W/ws"

          : > "$W/scans.txt"
          for m in 1 2 3 4 5 6; do
            for t in 8793 9143 1114 2056; do
              base=$(( 40 - (t % 7) * 3 ))
              printf 'ada\t%s\t%s\t3\t%s\tpark\n' "$m" "$t" "$((base + m))"     >> "$W/scans.txt"
              printf 'bo\t%s\t%s\t3\t%s\tpark\n'  "$m" "$t" "$((base + m + 1))" >> "$W/scans.txt"
            done
          done
          $C ingest "$W/scans.txt" --dir "$W/ws"

          printf '%s' '{"schemaId":"courier.generic.tsv.v1","format":"delimited","delimiter":"\t","fields":[{"name":"auto","type":"integer","source":3,"min":0,"max":200},{"name":"teleop","type":"integer","source":4,"min":0,"max":500},{"name":"endgame","type":"string","source":5}]}' > "$W/schema.json"

          $C picklist --dir "$W/ws" --schema "$W/schema.json" --field teleop --alliance 8793 --picks-between 2
          $C scouts   --dir "$W/ws" --schema "$W/schema.json" --field teleop

          # A board that quietly ranks nothing is the failure that matters here,
          # so require a real team to appear on it.
          $C picklist --dir "$W/ws" --schema "$W/schema.json" --field teleop --alliance 8793 | grep -q 9143
          $C scouts --dir "$W/ws" --schema "$W/schema.json" --field teleop | grep -q "had a second opinion"

          # And the refusals stay refusals rather than degrading to empty output.
          if $C picklist --dir "$W/ws" --schema "$W/schema.json" --field nope --alliance 8793; then
            echo "::error::picklist accepted a field that does not exist"
            exit 1
          fi
          echo "Analysis commands produced a board and refused a bad field."
